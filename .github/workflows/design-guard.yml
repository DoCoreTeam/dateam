name: design-guard
# 디자인 토큰 가드 + 타입체크 — PR/푸시에서 하드코딩 색/치수 재유입 차단
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 디자인 토큰 가드 (인라인 하드코딩 색/보더 차단)
        run: node scripts/check-design-tokens.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: 의존성 설치
        run: pnpm install --frozen-lockfile
      - name: 타입체크
        run: npx tsc --noEmit -p apps/web/tsconfig.json
      - name: 단위 가드 (UI 계약·인증 경계·SSOT)
        run: pnpm --filter web test
      - name: 프로덕션 빌드
        # 왜: tsc·테스트·design:check가 전부 초록인데 `next build`만 깨지는 회귀가 있다.
        #   실제로 v0.7.455에서 /develop이 Suspense 없이 useSearchParams를 쓰는 부품을
        #   렌더하게 되면서 빌드가 깨졌고, CI가 빌드를 안 돌아 **이틀간 배포 불가**였는데
        #   아무도 몰랐다(v0.7.470에서 발견·수정).
        # 자격증명은 넣지 않는다 — 플레이스홀더로도 빌드가 통과함을 확인했다.
        #   (Supabase를 실제로 부르는 화면은 전부 동적 렌더라 프리렌더 대상이 아니다)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key
        run: pnpm --filter web exec next build
      # E2E는 여기서 돌리지 않는다 — 로그인 세션(apps/web/e2e/auth-state.json)이 필요한데
      # 그건 사람이 직접 로그인해 만드는 로컬 산출물이고 저장소에 없다(자격증명을 CI에 두지 않는다).
      # 대신 **읽기 전용 8개 스펙**을 로컬에서 돌리는 것을 릴리스 전 절차로 둔다:
      #   pnpm exec playwright test apps/web/e2e/{work-ia,work-overview,work-shell-uniformity,
      #     work-dashboard,patchnotes-entry,daily-dept-separation,gpu-unified-table,
      #     gpu-curation-config-ladder}.spec.ts
      # 나머지 26개는 실데이터를 변경할 수 있어 의도적으로 제외한다.
      # (v0.7.475: 이 8개가 사흘간 18건 실패 중이었는데 아무도 몰랐다 — 접근성 회귀였다)
